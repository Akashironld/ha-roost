rules:
  # Bronze
  action-setup: done                  # services registered in async_setup (__init__.py)
  appropriate-polling: done           # no polling: entities follow the manager (should_poll False)
  brands: done                        # custom_components/roost/brand
  common-modules: done                # entity.py, mgr_common.py
  config-flow: done
  config-flow-test-coverage: todo     # tests/ha/test_config_flow.py covers most steps, not every branch yet
  dependency-transparency: done       # no requirements
  docs-actions: done                  # docs/GUIDE.md "Entities, services and automations"
  docs-conditions:
    status: exempt
    comment: Roost has no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: Roost has no triggers.
  entity-event-setup: done            # listeners added in async_added_to_hass (entity.py)
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done         # the Weheat device and its entities are checked in the config flow
  test-before-setup:
    status: exempt
    comment: Roost works from Home Assistant's own state and keeps working when a source is missing; what is
      missing becomes a repair issue and the reason shown, instead of a failed setup.
  unique-config-entry: done           # one entry per Weheat heat pump (unique_id = device id)
  # Silver
  action-exceptions: done             # ServiceValidationError on wrong input
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: exempt
    comment: The entities are Roost's own calculations; when a source is unavailable they show the reason and a
      repair issue is raised instead of going unavailable.
  integration-owner: done
  log-when-unavailable: done          # sources gone and back are events, repair issues and one log line
  parallel-updates: done            # PARALLEL_UPDATES = 0: read-only entities, the manager computes
  reauthentication-flow: done         # Roost's own Weheat login
  test-coverage: todo                 # 80 % (the steering code 99 %)
  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Roost is a service on top of the Weheat integration and other entities; nothing to discover.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done        # docs/GUIDE.md "Known limitations"
  docs-supported-devices: done        # Weheat heat pumps; thermostats; OpenTherm masters keeping the agreement
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One service device per entry; extra rooms are config subentries.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done           # icons.json
  reconfiguration-flow: done        # another heat pump or thermostat; every other setting in the options flow
  repair-issues: done
  stale-devices:
    status: exempt
    comment: One service device per entry, removed with the entry.
  # Platinum
  async-dependency: done              # no dependencies outside Home Assistant
  inject-websession: done             # async_get_clientsession
  strict-typing: done               # mypy: no findings (tools/ci_local.sh keeps it so)
