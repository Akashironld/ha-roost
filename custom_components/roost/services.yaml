pause:
  fields:
    hours:
      default: 2
      selector:
        number:
          min: 0.25
          max: 72
          step: 0.25
          unit_of_measurement: h
resume:
away:
  fields:
    until:
      selector:
        datetime:
    days:
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.5
          unit_of_measurement: d
    minimum:
      default: 16
      selector:
        number:
          min: 5
          max: 20
          step: 0.5
          unit_of_measurement: "°C"
home:
set_settings:
  fields:
    control:
      selector:
        select:
          options:
            - thermostat
            - opentherm
    ot_min_flow:
      selector:
        number:
          min: 10
          max: 40
          step: 0.5
          unit_of_measurement: "°C"
    ot_max_flow:
      selector:
        number:
          min: 25
          max: 50
          step: 0.5
          unit_of_measurement: "°C"
    ot_max_starts:
      selector:
        number:
          min: 0
          max: 24
    ot_quiet:
      selector:
        boolean:
    ot_quiet_from:
      selector:
        number:
          min: 0
          max: 23
    ot_quiet_to:
      selector:
        number:
          min: 0
          max: 23
    ot_quiet_max:
      selector:
        number:
          min: 0.5
          max: 10
          step: 0.1
          unit_of_measurement: "kW"
    ot_relearn:
      selector:
        boolean:
    comfort:
      selector:
        number:
          min: 15
          max: 25
          step: 0.5
          unit_of_measurement: "°C"
    day_min:
      selector:
        number:
          min: 10
          max: 25
          step: 0.5
          unit_of_measurement: "°C"
    night_min:
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: "°C"
    store_max:
      selector:
        number:
          min: 15
          max: 28
          step: 0.5
          unit_of_measurement: "°C"
    lowest_setpoint:
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: "°C"
    day_from:
      selector:
        number:
          min: 0
          max: 23
          step: 1
          unit_of_measurement: "h"
    day_to:
      selector:
        number:
          min: 1
          max: 24
          step: 1
          unit_of_measurement: "h"
    weekly_comfort:
      selector:
        boolean:
    comfort_schedule:
      selector:
        object:
    pump_entities:
      selector:
        object:
import_history:
  fields:
    days:
      default: 365
      selector:
        number:
          min: 7
          max: 365
          unit_of_measurement: d
explain_saving:
  fields:
    day:
      default: yesterday
      example: "2026-10-19"
      selector:
        text:
