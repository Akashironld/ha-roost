pause:
  fields:
    hours:
      default: 2
      selector:
        number:
          min: 0.25
          max: 72
          step: 0.25
          unit_of_measurement: h
resume:
away:
  fields:
    until:
      selector:
        datetime:
    days:
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.5
          unit_of_measurement: d
    minimum:
      default: 16
      selector:
        number:
          min: 5
          max: 20
          step: 0.5
          unit_of_measurement: "°C"
home:
set_comfort:
  fields:
    temperature:
      required: true
      selector:
        number:
          min: 15
          max: 25
          step: 0.5
          unit_of_measurement: "°C"
import_history:
  fields:
    days:
      default: 365
      selector:
        number:
          min: 7
          max: 365
          unit_of_measurement: d
