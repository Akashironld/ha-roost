      default: 2
      selector:
        number:
          min: 0.25
          max: 72
          step: 0.25
          unit_of_measurement: h
resume:
import_history:
  fields:
    days:
      default: 400
      selector:
        number:
          min: 7
          max: 1500
          unit_of_measurement: d
